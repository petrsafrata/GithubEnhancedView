site_name: GitHub Enhanced View
site_description: Local-first enhancements for GitHub repositories
site_author: Petr Šafrata
site_url: https://petrsafrata.github.io/GitHubEnhancedView/

repo_name: petrsafrata/GitHubEnhancedView
repo_url: https://github.com/petrsafrata/GitHubEnhancedView
edit_uri: edit/master/docs/

theme:
  name: material
  language: en
  logo: images/github-enhanced-view-icon.png
  favicon: images/github-enhanced-view-icon.png
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Configuration: getting-started/configuration.md
  - Features:
      - Feature Overview: features.md
      - GitHub API and File Sizes: github-api.md
      - VS Code Integration: vscode-integration.md
  - Architecture: architecture.md
  - Security: security.md
  - Development: development.md
  - Troubleshooting: troubleshooting.md
  - Legal:
      - Privacy Policy: privacy.md
      - Third-Party Notices: third-party-notices.md
      - License: license.md
  - Release Notes: release-notes.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

copyright: Copyright &copy; 2026 Petr Šafrata

